<!doctype html><html lang="vi"><head><meta charset="utf-8"><script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:'BVP';src:url('assets/fonts/BeVietnamPro-Medium.ttf');font-weight:500}
@font-face{font-family:'BVP';src:url('assets/fonts/BeVietnamPro-SemiBold.ttf');font-weight:600}
@font-face{font-family:'BVP';src:url('assets/fonts/BeVietnamPro-ExtraBold.ttf');font-weight:800}
@font-face{font-family:'BVP';src:url('assets/fonts/BeVietnamPro-Black.ttf');font-weight:900}
body{margin:0}#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:BVP,sans-serif}.clip{position:absolute;inset:0}
</style></head><body>
<!-- edit-tech-tutorial starter: hook nền sáng (2 chế độ) → hướng dẫn nền tối có screen recording. Thời gian theo VO thật. -->
<div id="root" data-composition-id="tutorial-film" data-start="0" data-duration="11" data-width="1080" data-height="1920" data-fps="30">
  <div id="scene-hook" class="clip" data-composition-id="hook" data-composition-src="compositions/hook-light.html" data-start="0" data-duration="4" data-track-index="0"></div>
  <div id="scene-step" class="clip" data-composition-id="step" data-composition-src="compositions/step-dark.html" data-start="4" data-duration="7" data-track-index="1"></div>
  <!-- VO: <audio id="vo" class="clip" src="assets/voice.wav" data-start="0" data-volume="1" data-track-index="5"></audio> -->
</div>
<script>window.__timelines=window.__timelines||{};window.__timelines["tutorial-film"]=gsap.timeline({paused:true});</script>
</body></html>
